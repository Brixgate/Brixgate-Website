<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Confirming your registration | Brixgate</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/png" href="/assets/faviii.png" />
  <link rel="stylesheet" href="/styles.css" />

<style>
/* ============================================================
   ACCESS FEE CALLBACK

   Paystack and Stripe both return here. Landing here does not mean
   the payment worked — both providers also return after a failure
   or a cancellation — so the only thing that decides is the
   backend's own verify call.

   Dark, matching the registration page and the apply flow.
   ============================================================ */
body.pa {
  --pa-ink:#F2F5F9; --pa-ink2:#DCE3EC; --pa-body:#9FB0C4; --pa-muted:#7E8FA3;
  --pa-faint:#5C6B7E; --pa-line:#1E2F45; --pa-line2:#182437; --pa-surface:#0E1928;
  --pa-red:#FF294E;
  background:#070E18; color:var(--pa-ink);
  min-height:100vh; display:flex; flex-direction:column;
}
.pa a { color:inherit; }
.pa-wrap { max-width:640px; margin:0 auto; padding:0 20px; width:100%; }
main { flex:1; }

.pa-top { background:#070E18; border-bottom:1px solid var(--pa-line); }
.pa-top-in { max-width:1080px; margin:0 auto; padding:16px 20px; }
.pa-top img { height:30px; display:block; }

.pa-state { padding:80px 0 100px; text-align:center; }
.pa-state-card {
  background:var(--pa-surface); border:1px solid var(--pa-line);
  border-radius:20px; padding:40px 32px; box-shadow:0 24px 60px -20px rgba(0,0,0,.6);
}
.pa-ico { width:60px; height:60px; border-radius:50%; display:grid; place-items:center; margin:0 auto 20px; font-size:1.6rem; font-weight:700; }
.pa-ico.ok   { background:rgba(22,163,74,.16);  color:#7CEFA6; }
.pa-ico.err  { background:rgba(255,41,78,.14);  color:#FF8FA3; }
.pa-ico.wait { background:rgba(120,160,220,.14); color:#AFC6E4; }
.pa-state h1 { font-size:1.45rem; color:var(--pa-ink); letter-spacing:-.025em; margin-bottom:12px; }
.pa-state p { color:var(--pa-body); font-size:.96rem; line-height:1.75; }
.pa-state p b { color:var(--pa-ink); }
.pa-state p + p { margin-top:12px; }

.pa-next { margin-top:24px; text-align:left; border:1px solid var(--pa-line); border-radius:14px; background:#0A1320; padding:20px 22px; }
.pa-next h2 { font-size:.72rem; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--pa-muted); margin-bottom:12px; }
.pa-next ol { margin:0; padding-left:20px; }
.pa-next li { font-size:.92rem; line-height:1.7; color:var(--pa-body); }
.pa-next li + li { margin-top:8px; }

.pa-ref { margin-top:22px; padding:12px 14px; border-radius:12px; background:#0A1320; border:1px dashed var(--pa-line); font-size:.78rem; color:var(--pa-muted); }
.pa-ref b { display:block; margin-top:4px; color:var(--pa-ink); font-size:.9rem; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; letter-spacing:.04em; }

.pa-btn {
  display:inline-block; margin-top:24px; padding:13px 26px; border:0; border-radius:999px;
  background:var(--pa-red); color:#fff; font:inherit; font-size:.95rem; font-weight:700;
  cursor:pointer; transition:.2s; box-shadow:0 10px 26px -10px rgba(255,41,78,.7);
}
.pa-btn:hover { background:#E01F42; transform:translateY(-1px); }
.pa-btn.ghost { background:transparent; color:var(--pa-ink); border:1.5px solid var(--pa-line); margin-left:8px; box-shadow:none; }
.pa-btn.ghost:hover { border-color:var(--pa-red); background:transparent; }

.pa-spin { width:34px; height:34px; border-radius:50%; margin:0 auto 20px; border:3px solid var(--pa-line); border-top-color:var(--pa-red); animation:paSpin .8s linear infinite; }
@keyframes paSpin { to { transform:rotate(360deg); } }
@media (prefers-reduced-motion:reduce) { .pa-spin { animation:none; } }

.pa-foot { border-top:1px solid var(--pa-line); background:#070E18; padding:22px 0; }
.pa-foot p { font-size:.8rem; color:var(--pa-muted); text-align:center; }
.pa-foot a { color:var(--pa-body); font-weight:600; }
.pa-foot a:hover { color:var(--pa-red); }
</style>
</head>
<body class="pa">

<header class="pa-top">
  <div class="pa-top-in"><a href="/"><img src="/assets/logo-color-nobg.svg" alt="Brixgate" /></a></div>
</header>

<main class="pa-wrap">
  <div class="pa-state" id="pa-state">
    <div class="pa-state-card">
      <div class="pa-spin"></div>
      <h1>Confirming your payment…</h1>
      <p>This takes a few seconds. Please don't close this page.</p>
    </div>
  </div>
</main>

<footer class="pa-foot">
  <div class="pa-wrap">
    <p>© <span id="pa-year">2026</span> Brixgate Ltd, RC 9082968 ·
       <a href="mailto:we@brixgate.com">we@brixgate.com</a></p>
  </div>
</footer>

<script>
/* ============================================================
   Verify, then say only what is true.

   A paid access fee is a registration of interest. It is not
   enrolment and it is not course access — the success screen has
   to leave the person knowing that, or the refund conversation
   happens later instead.
   ============================================================ */
(function () {
  'use strict';

  var API = 'https://dev.api.brixgate.com/api/v1';   /* rewritten to api.brixgate.com at deploy */

  var box = document.getElementById('pa-state');
  var q   = new URLSearchParams(location.search);

  var POLL_EVERY = 5000;
  var POLL_TIMES = 6;          /* ~30s, then stop and let the backend job finish it */

  document.getElementById('pa-year').textContent = new Date().getFullYear();

  function esc(v) {
    return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
    });
  }

  function stored() { try { return sessionStorage.getItem('bx_access_fee_reference'); } catch (e) { return null; } }
  function forget() { try { sessionStorage.removeItem('bx_access_fee_reference'); } catch (e) {} }

  var reference = q.get('reference') || q.get('trxref') || stored();

  function show(o) {
    box.innerHTML =
      '<div class="pa-state-card">' +
        '<div class="pa-ico ' + o.icon + '">' + o.glyph + '</div>' +
        '<h1>' + esc(o.title) + '</h1>' +
        o.body +
        (o.next ? '<div class="pa-next"><h2>What happens next</h2><ol>' + o.next + '</ol></div>' : '') +
        (o.ref ? '<div class="pa-ref">Payment reference<b>' + esc(o.ref) + '</b></div>' : '') +
        (o.cta || '') +
      '</div>';
  }

  if (!reference) {
    return show({
      icon: 'err', glyph: '?',
      title: 'We could not find your payment reference',
      body: '<p>If you have just paid, check your email — a confirmation may already be on its way. ' +
            'If nothing arrives, contact <a href="mailto:we@brixgate.com" style="color:#FF8FA3;font-weight:600">we@brixgate.com</a> ' +
            'and we will find it.</p>'
    });
  }

  run(0);

  function run(attempt) {
    fetch(API + '/waitlist/access-fee-payments/' + encodeURIComponent(reference))
      .then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (b) { return { ok: r.ok, status: r.status, b: b }; });
      })
      .then(function (r) {
        if (r.status === 404) {
          return show({
            icon: 'err', glyph: '!',
            title: 'We could not find this payment',
            body: '<p>The reference may be wrong, or the payment may not have started. If you were charged, ' +
                  'send us this reference and we will sort it out.</p>',
            ref: reference,
            cta: '<a class="pa-btn" href="mailto:we@brixgate.com">Email us</a>'
          });
        }
        if (!r.ok) return again(attempt);

        var d  = r.b.data || {};
        var p  = d.payment || {};
        var st = String(p.payment_status || '').toUpperCase();

        /* The two must agree. access_granted alone is not enough, and
           neither is a SUCCESS status without it. */
        if (st === 'SUCCESS' && d.access_granted === true) { forget(); return paid(p); }
        if (st === 'FAILED' || st === 'CANCELLED')          { forget(); return failed(st, p); }

        return again(attempt, p);
      })
      .catch(function () { again(attempt); });
  }

  function again(attempt, p) {
    if (attempt + 1 >= POLL_TIMES) return pending(p);
    setTimeout(function () { run(attempt + 1); }, POLL_EVERY);
  }

  /* ---------- outcomes ---------- */

  function paid(p) {
    show({
      icon: 'ok', glyph: '✓',
      title: 'You’re registered',
      body: '<p>Your registration fee has been received. We’ve emailed your confirmation.</p>' +
            '<p style="font-size:.88rem"><b>To be clear about what this is:</b> you have registered your ' +
            'interest. This is not enrolment, and the fee is not credited toward tuition. Our team will be ' +
            'in touch about dates, the full fee and the next steps.</p>',
      next: '<li>Check your email — if you’re new to Brixgate, there’s a link to set your password.</li>' +
            '<li>Set it, then sign in to see your registration.</li>' +
            '<li>We’ll contact you about the cohort and the next steps.</li>',
      ref: p.brixgate_reference || reference,
      cta: '<a class="pa-btn" href="https://portal.brixgate.com/login" target="_blank" rel="noopener">Go to the portal</a>' +
           '<a class="pa-btn ghost" href="/">Back to site</a>'
    });
  }

  function failed(st, p) {
    show({
      icon: 'err', glyph: '✕',
      title: st === 'CANCELLED' ? 'Payment cancelled' : 'Payment failed',
      body: '<p>You have not been charged. You can try again from the link we sent you — ' +
            'it stays valid.</p>',
      ref: p.brixgate_reference || reference,
      cta: '<a class="pa-btn" href="javascript:history.back()">Try again</a>' +
           '<a class="pa-btn ghost" href="mailto:we@brixgate.com">Email us</a>'
    });
  }

  function pending(p) {
    show({
      icon: 'wait', glyph: '⋯',
      title: 'We haven’t confirmed your payment yet',
      body: '<p>Bank transfers and USSD can take a few minutes to clear. If you were charged, your ' +
            'registration will complete on its own and you’ll get an email — there is nothing else ' +
            'for you to do.</p>' +
            '<p>If you were not charged, you can try again from the link we sent you.</p>',
      ref: (p && p.brixgate_reference) || reference,
      cta: '<a class="pa-btn" href="">Check again</a>' +
           '<a class="pa-btn ghost" href="mailto:we@brixgate.com">Email us</a>'
    });
  }
})();
</script>
</body>
</html>
