name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Production must talk to the production API. Every page ships with
      # the dev host hardcoded so local work needs no setup, and this is
      # the one place it gets swapped. Losing this step is silent: the site
      # deploys fine and quietly reads and writes dev data.
      - name: Swap API URL for production
        run: |
          find . -name "*.html" -o -name "*.js" \
            | xargs sed -i "s|https://dev.api.brixgate.com|https://api.brixgate.com|g"
          echo "Remaining dev API references (should be 0):"
          grep -rl "dev\.api\.brixgate\.com" --include="*.html" --include="*.js" . | wc -l

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      # rsync --delete keeps the server an exact mirror, which also means
      # anything excluded here is REMOVED from the web root on the next
      # run. The list is deliberately long: without it this pushes build
      # scripts, the .claude directory, the dist folder, font archives and
      # the local zip artefact straight into a public directory.
      - name: Deploy via rsync
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='.git*' \
            --exclude='.github' \
            --exclude='.claude' \
            --exclude='.vercel' \
            --exclude='.DS_Store' \
            --exclude='dist/' \
            --exclude='node_modules/' \
            --exclude='tools/' \
            --exclude='build.sh' \
            --exclude='*.zip' \
            --exclude='*.pem' \
            --exclude='README*' \
            -e "ssh -p ${{ secrets.SSH_PORT }}" \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/var/www/html/

      # A deploy that connects, transfers nothing and reports success is
      # the failure worth guarding against, so prove the site answers and
      # that it is actually the build we just pushed.
      - name: Verify the site is serving
        run: |
          code=$(curl -s -o /tmp/live.html -w '%{http_code}' --max-time 25 https://brixgate.com/)
          echo "brixgate.com returned $code"
          test "$code" = "200"
          if grep -q "dev\.api\.brixgate\.com" /tmp/live.html; then
            echo "::error::Live site is pointing at the dev API"
            exit 1
          fi
