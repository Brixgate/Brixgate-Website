name: Deploy to Production

on:
  push:
    branches:
      - main
  # Lets a deploy be run by hand from the Actions tab. With dry_run left
  # on it changes nothing and only reports, which is how the --delete
  # list gets reviewed before it is ever allowed to run for real.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report only. Show what a deploy would change, write nothing.'
        type: boolean
        default: true

# Only the key is a secret. The address is in public DNS, the user and
# port are not sensitive either, and every extra secret is another thing
# that can be set wrong in a place you cannot read back.
env:
  SSH_HOST: 209.97.128.205
  SSH_USER: deploy
  SSH_PORT: '22'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Production must talk to the production API. Every page ships with
      # the dev host hardcoded so local work needs no setup, and this is
      # the one place it gets swapped. Losing this step is silent: the site
      # deploys fine and quietly reads and writes dev data.
      - name: Swap API URL for production
        run: |
          find . -name "*.html" -o -name "*.js" \
            | xargs sed -i "s|https://dev.api.brixgate.com|https://api.brixgate.com|g"
          echo "Remaining dev API references (should be 0):"
          grep -rl "dev\.api\.brixgate\.com" --include="*.html" --include="*.js" . | wc -l

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ env.SSH_PORT }}" "${{ env.SSH_HOST }}" >> ~/.ssh/known_hosts

      # --omit-dir-times is required, not cosmetic. The web root and its
      # subdirectories are owned by www-data and the deploy user reaches
      # them through the group via the setgid bit. A group member may
      # write files into a directory but may not change that directory's
      # own mtime, so rsync -a (which preserves times) is refused on every
      # directory and exits 23 after transferring everything successfully.
      # A job that always fails is a job whose failures nobody reads.
      #
      # --delete is on. The inventory it was waiting for came back with a
      # single entry, index.nginx-debian.html, the stock nginx placeholder.
      # /var/www/html/aiquiz/ is no longer at risk because it is tracked in
      # the repo now. The step below still prints the list on every run, so
      # anything new appearing gets seen before it is removed.
      # --omit-dir-times was half the fix. -a also implies -p and -g, and
      # the deploy user cannot set permissions or group on files owned by
      # www-data either, so rsync still transferred everything and still
      # exited 23. Dropping -a for its parts minus the attribute flags
      # leaves the web root's existing ownership alone, which is what we
      # want: nginx owns the files, we only replace their contents.
      #
      # Exit 23 is still tolerated rather than ignored. It means "partial
      # transfer due to error", and an attribute error we cannot avoid
      # reads the same as a file that genuinely failed to copy, so the
      # errors are printed either way and Verify below is what actually
      # decides whether the deploy was good. Any other non-zero code
      # still fails the job outright.
      - name: Deploy via rsync
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          set +e
          rsync -rlvz --no-perms --no-owner --no-group --omit-dir-times --delete \
            --exclude='.git' \
            --exclude='.git*' \
            --exclude='.github' \
            --exclude='.claude' \
            --exclude='.vercel' \
            --exclude='.DS_Store' \
            --exclude='dist/' \
            --exclude='node_modules/' \
            --exclude='tools/' \
            --exclude='build.sh' \
            --exclude='*.zip' \
            --exclude='*.pem' \
            --exclude='README*' \
            -e "ssh -p ${{ env.SSH_PORT }}" \
            ./ ${{ env.SSH_USER }}@${{ env.SSH_HOST }}:/var/www/html/
          code=$?
          set -e
          echo "rsync exited $code"
          if [ "$code" -eq 0 ]; then exit 0; fi
          if [ "$code" -eq 23 ]; then
            echo "::warning::rsync exited 23: files were sent, see the errors above. Verify decides the outcome."
            exit 0
          fi
          exit "$code"

      # A deploy that connects, transfers nothing and reports success is
      # the failure worth guarding against, so prove the site answers and
      # that it is actually the build we just pushed.
      - name: Verify the site is serving
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          code=$(curl -s -o /tmp/live.html -w '%{http_code}' --max-time 25 https://brixgate.com/)
          echo "brixgate.com returned $code"
          test "$code" = "200"
          if grep -q "dev\.api\.brixgate\.com" /tmp/live.html; then
            echo "::error::Live site is pointing at the dev API"
            exit 1
          fi
